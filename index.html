<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Movies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h2 class="logo">Marvel Films</h2>
    </header>
    <div class="main">
      <div class="detailedFrame">
        <div class="detailedContainer">
          <img
            src="./images/marvel.jpg"
            alt="Marvel"
            class="detailedContainer--image animation-up"
          />
          <span class="detailedContainer--title animation-down">
            <span class="for_ellipsis"
              >This list Marvel films Select a movie to see details</span
            >
          </span>
          <span class="detailedContainer--overview animation-down"></span>
          <span class="detailedContainer--rating animation-down"></span>
        </div>
      </div>
      <ul class="gallery"></ul>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
